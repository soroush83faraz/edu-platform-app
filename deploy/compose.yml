# Production stack on the VPS: /srv/school/compose.yml  (docker compose v2)
# Only caddy publishes ports. Postgres and the app are reachable solely on the internal network.
name: school

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    # max_connections=100: app pool (DB_POOL_MAX, default 20) + migrate + backup + psql + a second app instance during a
    # deploy, with headroom; sized from the load test in docs/ops/capacity.md. shared_buffers/work_mem: postgres defaults.
    command:
      [
        "postgres",
        "-c", "password_encryption=scram-sha-256",
        "-c", "timezone=UTC",
        "-c", "max_connections=100",
      ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      # Consumed by db/initdb/01-roles.sh (first start only) to create app_owner / app_rw / app_backup.
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?set APP_OWNER_PASSWORD in .env}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?set APP_RW_PASSWORD in .env}
      APP_BACKUP_PASSWORD: ${APP_BACKUP_PASSWORD:?set APP_BACKUP_PASSWORD in .env}
      TZ: UTC
    expose: ["5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  migrate:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    command: ["node", "scripts/migrate.js"]
    restart: "no"
    env_file: .env
    environment:
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy

  # The permission / role / work-item-type / notification-type catalog, compiled from the TypeScript source of truth
  # at build time (scripts/seed-catalog.js, pg only, MIGRATION_DATABASE_URL = app_owner). Idempotent and authoritative
  # (role_permission rows no longer listed are removed), so it runs on EVERY deploy right after `migrate` — a release
  # that adds a permission or changes a role matrix needs no manual seed step. No accounts, no tenant rows.
  seed:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    command: ["node", "scripts/seed-catalog.js"]
    restart: "no"
    env_file: .env
    environment:
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    env_file: .env
    environment:
      TZ: UTC
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-${APP_IMAGE}}
      FILES_DIR: /data/files
    expose: ["3000"]
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  # Background jobs + recurring schedules (owner 2026-10-20; src/lib/jobs, docs/ops/runbook.md «کارهای پس‌زمینه»): the
  # SAME image as `app`, its own process — scripts/worker.mjs, bundled by `pnpm build`. Connects as app_rw
  # (DATABASE_URL, like the app; a small pool), mounts the files volume for the file sweeps. Stateless: stop / start /
  # restart any time — a run in flight rolls back and its job is claimed again when its lease expires. The healthcheck
  # reads the mtime of the file the loop touches every turn (the image's own HEALTHCHECK is the app's HTTP probe).
  worker:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    command: ["node", "--max-old-space-size=160", "scripts/worker.mjs"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    env_file: .env
    environment:
      TZ: UTC
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-${APP_IMAGE}}
      FILES_DIR: /data/files
      DB_POOL_MAX: "4"
      WORKER_ALIVE_FILE: /tmp/edu-worker-alive
    volumes:
      - files:/data/files
    mem_limit: 256m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/edu-worker-alive');process.exit(Date.now()-s.mtimeMs<90000?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
